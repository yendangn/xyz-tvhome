<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Tranh Đông Hồ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <!-- A folk painting (a bird on a magnolia branch) down the right edge, fading into the page on its left side. -->
  <img class="art" src="tranh.webp" width="600" height="1080" alt="">

  <div class="btns">
    <div class="btn" data-nav="top" data-action="themes" aria-label="Giao diện">
      <svg class="pal" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.3-.3-.4-.5-.8-.5-1.3 0-.9.8-1.7 1.7-1.7H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.1"/><circle cx="10.5" cy="7.2" r="1.1"/><circle cx="15.2" cy="7.6" r="1.1"/></svg>
    </div>
    <div class="btn" data-nav="top" data-action="wifi" aria-label="Wi-Fi">
      <svg class="wifi" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path class="w3" d="M2 8.5a15 15 0 0 1 20 0"/><path class="w2" d="M5.5 12.5a10 10 0 0 1 13 0"/><path class="w1" d="M9 16.3a5 5 0 0 1 6 0"/><circle class="w0" cx="12" cy="20" r="1.2" stroke="none"/></svg>
    </div>
  </div>

  <div class="col">
    <div class="bar"><span class="hello">Chào <span id="dayPart">buổi chiều</span>, <span data-owner>Yên Đặng</span></span></div>

    <div class="mast">
      <div class="clock" id="clock"></div>
      <div class="day">
        <div class="wk" id="weekday"></div>
        <div class="dt" id="dateText"></div>
        <div class="lu" id="lunarLine"></div>
      </div>
    </div>

    <div class="blocks">
      <section class="block cal" id="cal">
        <div class="top"><h2 id="calTitle"></h2><span id="calSpan"></span></div>
        <div class="wd"><span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span></div>
        <div class="grid" id="calGrid"></div>
      </section>

      <section class="block gold">
        <h2>Giá vàng</h2>
        <div class="unit">triệu đ / lượng</div>
        <div class="lbl">SJC · bán ra</div>
        <div class="v" id="sjc">–</div>
        <div class="buy">Mua vào <span id="sjcBuy">–</span></div>
        <div class="rule"></div>
        <div class="lbl2">Nhẫn 999.9</div>
        <div class="ring"><span class="rs" id="ring">–</span><span class="rb"> / <span id="ringBuy">–</span></span></div>
      </section>

      <section class="block fuel">
        <h2>Xăng dầu</h2>
        <div class="unit">đ / lít · vùng 1</div>
        <div class="rows">
          <div class="r"><span class="badge">95</span><span class="kv"><span class="k">E10 RON95</span><span class="v" id="e10">–</span></span></div>
          <div class="r"><span class="badge">92</span><span class="kv"><span class="k">E5 RON92</span><span class="v" id="e5">–</span></span></div>
          <div class="r"><span class="badge">DO</span><span class="kv"><span class="k">Dầu diesel</span><span class="v" id="do">–</span></span></div>
        </div>
      </section>
    </div>

    <nav class="dock">
      <div class="tile" data-nav="dock" data-pkg="com.google.android.youtube.tv">
        <span class="ico"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="4"/><path class="f" d="M10 9l5 3-5 3z"/></svg></span>
        <span>YouTube</span>
      </div>
      <div class="tile" data-nav="dock" data-pkg="com.android.vending">
        <span class="ico"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linejoin="round"><path d="M4 8h16l-1.5 13h-13z"/><path d="M8.5 8V6.5a3.5 3.5 0 0 1 7 0V8"/><path class="f" d="M10.5 12l4 2.5-4 2.5z"/></svg></span>
        <span>Cửa hàng</span>
      </div>
      <div class="tile" data-nav="dock" data-action="apps">
        <span class="ico"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg></span>
        <span>Ứng dụng</span>
      </div>
      <div class="tile" data-nav="dock" data-action="settings">
        <span class="ico"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/><circle cx="12" cy="12" r="6.5"/></svg></span>
        <span>Cài đặt</span>
      </div>
    </nav>
  </div>
</div>
<script src="../../core.js"></script>
</body>
</html>

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Hiện đại tối giản</title>
<link rel="stylesheet" href="../../shared/modern.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div class="bar">
    <div class="hello"><span class="dot"></span><span>Xin chào, <span data-owner>Yên Đặng</span></span></div>
    <div class="btns">
      <div class="btn" data-nav="top" data-action="themes" aria-label="Giao diện">
        <svg class="pal" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.7 1.8-1.7h2.1A4.3 4.3 0 0 0 21 11c0-4.4-4-8-9-8z"/><circle class="a" cx="7.5" cy="11.5" r="1.3" stroke="none"/><circle class="t" cx="10.5" cy="7.5" r="1.3" stroke="none"/><circle class="t" cx="15.5" cy="7.8" r="1.3" stroke="none"/></svg>
      </div>
      <div class="btn" data-nav="top" data-action="wifi" aria-label="Wi-Fi">
        <svg class="wifi" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path class="w3" d="M2 8.5a15 15 0 0 1 20 0"/><path class="w2" d="M5.5 12.5a10 10 0 0 1 13 0"/><path class="w1" d="M9 16.3a5 5 0 0 1 6 0"/><circle class="w0" cx="12" cy="20" r="1.2" stroke="none"/></svg>
      </div>
    </div>
  </div>

  <div class="mast">
    <div class="clock" id="clock"></div>
    <div class="day">
      <div class="wk" id="weekday"></div>
      <div class="dt" id="dateText"></div>
    </div>
  </div>

  <div class="blocks">
    <section class="block cal" id="cal">
      <div class="top"><h2 id="calTitle"></h2><span id="calSpan"></span></div>
      <div class="wd"><span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span></div>
      <div class="grid" id="calGrid"></div>
    </section>

    <section class="block gold">
      <div class="head">
        <span class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linejoin="round"><path d="M3 18h8l-1.5-5h-5z"/><path d="M13 18h8l-1.5-5h-5z"/><path d="M8 11h8l-1.5-5h-5z"/></svg></span>
        <h2>Giá vàng</h2>
      </div>
      <div class="sub">triệu đồng / lượng · bán ra</div>
      <div class="rows">
        <div class="r"><span class="k">SJC</span><span class="v" id="sjc">–</span></div>
        <div class="rule"></div>
        <div class="r"><span class="k">Nhẫn 999.9</span><span class="v" id="ring">–</span></div>
        <div class="note">Mua vào <span id="sjcBuy">–</span> / <span id="ringBuy">–</span> · <span id="priceTime"></span></div>
      </div>
    </section>

    <section class="block fuel">
      <div class="head">
        <span class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><rect x="4" y="4" width="10" height="16" rx="2"/><path d="M4 10h10"/><path d="M14 8l4 3v6a1.5 1.5 0 0 0 3 0V9l-3-3"/></svg></span>
        <h2>Xăng dầu</h2>
      </div>
      <div class="sub">đồng / lít · Petrolimex vùng 1</div>
      <div class="rows">
        <div class="r"><span class="k">E10 RON95</span><span class="v" id="e10">–</span></div>
        <div class="rule"></div>
        <div class="r"><span class="k">E5 RON92</span><span class="v" id="e5">–</span></div>
        <div class="rule"></div>
        <div class="r"><span class="k">Dầu DO</span><span class="v" id="do">–</span></div>
      </div>
    </section>
  </div>

  <nav class="dock">
    <div class="tile" data-nav="dock" data-pkg="com.google.android.youtube.tv">
      <span class="ico"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="4"/><path class="f" d="M10 9l5 3-5 3z"/></svg></span>
      <span>YouTube</span>
    </div>
    <div class="tile" data-nav="dock" data-pkg="com.android.vending">
      <span class="ico"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h16l-1.5 13h-13z"/><path d="M8.5 8V6.5a3.5 3.5 0 0 1 7 0V8"/><path class="f" d="M10.5 12l4 2.5-4 2.5z"/></svg></span>
      <span>Cửa hàng</span>
    </div>
    <div class="tile" data-nav="dock" data-action="settings">
      <span class="ico"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/><circle cx="12" cy="12" r="6.5"/></svg></span>
      <span>Cài đặt</span>
    </div>
    <div class="tile" data-nav="dock" data-action="apps">
      <span class="ico"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg></span>
      <span>Ứng dụng</span>
    </div>
  </nav>
</div>
<script src="../../core.js"></script>
</body>
</html>

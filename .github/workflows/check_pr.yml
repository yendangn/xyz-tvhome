# check_pr: every pull request into main must build the app. The main branch requires this check to pass before a
# merge (branch protection), so a change that breaks the build cannot go in.
name: check_pr

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check_pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check_pr:
    name: check_pr
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      # The tools build-web.mjs uses to pack and minify the themes.
      - run: npm --prefix scripts ci

      # The runner's Android SDK is found through ANDROID_HOME, so no app/local.properties is needed.
      - name: Build the release APK
        run: app/gradlew -p app assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
